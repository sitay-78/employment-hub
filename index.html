<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>AI Employment Intelligence Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: fixed navy sidebar + scrolling workspace of rounded cards; topbar with global search and quick actions. */
:root{
  --navy:#0f1f3d; --navy-2:#17294d; --navy-ink:#c9d4ea; --navy-ink-strong:#ffffff;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef2f8; --border:#dce3ee;
  --fg:#14213d; --muted:#5a6680;
  --blue:#2459d6; --blue-hover:#1c49b5; --blue-ink:#ffffff; --blue-soft:#e6eefc;
  --teal:#0e8a80; --teal-soft:#dff4f1;
  --green:#157a3d; --green-soft:#e3f4e9;
  --amber:#a85a06; --amber-soft:#fcf0dc;
  --red:#b42323; --red-soft:#fbe7e7;
  --grey-soft:#eceff4;
  --shadow:0 1px 2px rgba(15,31,61,.06),0 4px 14px rgba(15,31,61,.05);
  --font-head:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#08132b; --navy-2:#112041; --navy-ink:#b9c5de; --navy-ink-strong:#ffffff;
  --bg:#0c1322; --surface:#131c2e; --surface-2:#1a2539; --border:#283551;
  --fg:#e7ecf6; --muted:#9ca8c2;
  --blue:#5b8cff; --blue-hover:#7aa2ff; --blue-ink:#0a1430; --blue-soft:#1b2a4f;
  --teal:#34d1c0; --teal-soft:#123532;
  --green:#5bd88a; --green-soft:#13301f;
  --amber:#f5b84a; --amber-soft:#33270f;
  --red:#ff7b7b; --red-soft:#3a1818;
  --grey-soft:#1f2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#08132b; --navy-2:#112041; --navy-ink:#b9c5de; --navy-ink-strong:#ffffff;
  --bg:#0c1322; --surface:#131c2e; --surface-2:#1a2539; --border:#283551;
  --fg:#e7ecf6; --muted:#9ca8c2;
  --blue:#5b8cff; --blue-hover:#7aa2ff; --blue-ink:#0a1430; --blue-soft:#1b2a4f;
  --teal:#34d1c0; --teal-soft:#123532;
  --green:#5bd88a; --green-soft:#13301f;
  --amber:#f5b84a; --amber-soft:#33270f;
  --red:#ff7b7b; --red-soft:#3a1818;
  --grey-soft:#1f2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:1rem}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.sidebar{background:var(--navy);color:var(--navy-ink);padding:18px 12px 24px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2c6bff,#14b8a6);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px;stroke:#fff}
.brand-name{font-family:var(--font-head);font-weight:800;color:var(--navy-ink-strong);font-size:.98rem;line-height:1.2}
.brand-sub{font-size:.7rem;color:var(--navy-ink);opacity:.85;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;opacity:.6;padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--navy-ink);text-decoration:none;font-weight:500;font-size:.86rem}
.nav a:hover{background:var(--navy-2);color:var(--navy-ink-strong)}
.nav a.active{background:#2459d6;color:#fff}
.nav a svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;background:rgba(255,255,255,.12);border-radius:999px;padding:0 7px;font-size:.72rem}
.side-foot{margin-top:auto;font-size:.72rem;opacity:.8;padding:8px 10px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:var(--navy-ink-strong)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.btn.menu-btn{display:none}
.search{flex:1;max-width:560px;position:relative}
.search input[type=search]{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.clock{font-size:.8rem;color:var(--muted);white-space:nowrap}
.content{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--blue)}
.stat .k{font-size:.74rem;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--font-head);font-size:1.6rem;font-weight:800;line-height:1.15}
.stat .s{font-size:.72rem;color:var(--muted)}
.stat.green .v{color:var(--green)} .stat.amber .v{color:var(--amber)} .stat.red .v{color:var(--red)} .stat.teal .v{color:var(--teal)} .stat.blue .v{color:var(--blue)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.84rem;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{background:var(--blue-hover);color:var(--blue-ink)}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ai{border-color:var(--teal);color:var(--teal)}
.btn.ai:hover{background:var(--teal-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick{display:flex;flex-wrap:wrap;gap:8px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--grey-soft);color:var(--muted)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.score{display:inline-grid;place-items:center;min-width:44px;height:30px;border-radius:9px;font-family:var(--font-head);font-weight:800;font-size:.95rem}
.score.green{background:var(--green-soft);color:var(--green)}
.score.amber{background:var(--amber-soft);color:var(--amber)}
.score.red{background:var(--grey-soft);color:var(--muted)}

.vac{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--border)}
.vac:first-child{border-top:0}
.vac h4{font-size:.95rem}
.vac .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.8rem;margin-top:2px}
.vac .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stripe-green{box-shadow:inset 3px 0 0 var(--green)}
.list-empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--border);border-radius:12px}

.brief{background:linear-gradient(135deg,var(--navy),#1d3a75);color:#e8eefb;border:0}
.brief h2{color:#fff}
.brief .muted{color:#b9c6e2}
.brief ul{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.brief li{display:flex;gap:10px;align-items:flex-start}
.brief .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.brief a{color:#9cc0ff}
.brief-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:10px}
.brief h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#9fb3da}

label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.82rem}
label.f span.h{font-weight:400;color:var(--muted);font-size:.75rem}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.span-all{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.tag-input{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--border);border-radius:9px;padding:6px;background:var(--surface)}
.tag-input input{border:0;flex:1;min-width:140px;padding:4px;background:transparent}
.tag-input input:focus{outline:none}
.tag{background:var(--surface-2);border-radius:7px;padding:2px 4px 2px 8px;font-size:.8rem;display:inline-flex;gap:4px;align-items:center}
.tag button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}
.notice{border-radius:11px;padding:10px 14px;font-size:.84rem;display:flex;gap:10px;align-items:flex-start}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice.info{background:var(--blue-soft);color:var(--fg)}
.notice.warn{background:var(--amber-soft);color:var(--fg)}
.notice.err{background:var(--red-soft);color:var(--fg)}
.notice.ok{background:var(--green-soft);color:var(--fg)}
.muted{color:var(--muted)}
.small{font-size:.8rem}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--border)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.scroll-x{overflow-x:auto}

.kanban{display:grid;grid-template-columns:repeat(8,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col h3{font-size:.82rem;display:flex;justify-content:space-between}
.col.drop{outline:2px dashed var(--blue)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 10px;cursor:grab;font-size:.82rem}
.kcard b{display:block;font-size:.85rem}

.ai-out{white-space:normal;background:var(--surface-2);border-radius:11px;padding:14px 16px;font-size:.88rem;line-height:1.6;max-height:560px;overflow:auto}
.ai-out h4{margin:10px 0 4px;font-size:.92rem}
.ai-out ul{margin:4px 0;padding-left:20px}
.ai-out p{margin:6px 0}

.modal-back{position:fixed;inset:0;background:rgba(8,16,34,.55);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;box-shadow:var(--shadow);font-size:.86rem;max-width:min(420px,calc(100vw - 32px))}
.bar-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--teal);border-radius:99px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.board-link{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;text-decoration:none;color:var(--fg);font-size:.84rem}
.board-link:hover{border-color:var(--blue);color:var(--blue)}
.board-link small{color:var(--muted)}
.welcome{max-width:760px;margin:30px auto;display:flex;flex-direction:column;gap:14px}
details summary{cursor:pointer;font-weight:600}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.search-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:40;padding:6px}
.search-pop button{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;gap:10px;align-items:center}
.search-pop button:hover{background:var(--surface-2)}
.dropdown{position:relative}
.dropdown-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;min-width:260px}
.dropdown-menu button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;align-items:center}
.dropdown-menu button:hover{background:var(--surface-2)}
.dropdown-menu svg{width:15px;height:15px;stroke:var(--blue)}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:90;width:270px;transform:translateX(-105%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  .sidebar.open{transform:none}
  .btn.menu-btn{display:inline-flex}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .clock{display:none}
}
@media (max-width:560px){
  .vac{grid-template-columns:auto minmax(0,1fr)}
  .vac .actions{grid-column:1/-1;justify-content:flex-start}
  .top-right .label-hide{display:none}
}
</style>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/><path d="M8.5 11.5l1.8 1.8 3.4-3.6"/></svg></div>
      <div><div class="brand-name">AI Employment Intelligence Hub</div><div class="brand-sub">Intelligent Job Matching &amp; Personalised Employment Research</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot">Loading…</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn menu-btn" id="menuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="globalSearch" placeholder="Search profiles, vacancies, employers, opportunities…" aria-label="Global search" autocomplete="off">
        <div class="search-pop" id="searchPop" hidden></div>
      </div>
      <div class="top-right">
        <span class="clock tabnum" id="clock"></span>
        <div class="dropdown">
          <button class="btn primary" id="quickBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span class="label-hide">Quick actions</span></button>
          <div class="dropdown-menu" id="quickMenu" hidden></div>
        </div>
      </div>
    </header>
    <main class="content" id="view"><div class="list-empty">Loading your research data…</div></main>
  </div>
</div>
<div id="modalRoot"></div>
<input type="file" id="skillsFile" accept=".txt,.md,.docx,text/plain" hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
"use strict";
/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const TZ = "Europe/London";
const todayKey = (d = new Date()) => new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"}).format(d);
const dayKeyOf = (iso) => iso ? todayKey(new Date(iso)) : "";
function fmtDate(v) { if (!v) return "—"; if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { const [y, m, d] = v.split("-"); return `${d}/${m}/${y}`; } const d = new Date(v); if (isNaN(d)) return "—"; return d.toLocaleDateString("en-GB", {timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric"}); }
function fmtDateTime(v) { if (!v) return "—"; const d = new Date(v); if (isNaN(d)) return "—"; return fmtDate(v) + " " + d.toLocaleTimeString("en-GB", {timeZone: TZ, hour: "2-digit", minute: "2-digit"}); }

async function initStorage() {

    const [db, user] = await Promise.all([useCap("db"), useCap("user")]);
    if (!db || !user) return fallback("signed-out");
    const id = await user.id();
    const canWrite = await user.can("data.write").catch(() => null);
    if (!id || canWrite === false) return fallback("view-only");
    CAP.db = db; CAP.uid = id; CAP.col = db.collection("data/users/" + id);
    const timer = setTimeout(() => fallback("timeout"), 10000);

      if (resolved && CAP.mode !== "db") return;

      if (!resolved) { resolved = true; CAP.mode = "db"; boot(); }

  const hit = avoid.find(a => text.includes(a.toLowerCase()));

}
function chartByProfile() {
  const ps = S.profiles.filter(p => p.status !== "Archived"); if (!ps.length) return `<div class="list-empty">Add a profile to see matches.</div>`;
  const rows = ps.map(p => { const vs = S.vacancies.filter(v => v.profileId === p.id && !isClosed(v)); return {p, g: vs.filter(v => band(v.score) === "green").length, a: vs.filter(v => band(v.score) === "amber").length, r: vs.filter(v => band(v.score) === "red").length}; });
  const max = Math.max(1, ...rows.map(r => r.g + r.a + r.r)); const W = 520, rowH = 30, left = 96, H = rows.length * rowH + 24;
  const ticks = [0, Math.ceil(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
  const x = (n) => left + (n / max) * (W - left - 30);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Open vacancies per profile by band">`;
  ticks.forEach(t => { s += `<line x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H - 18}" stroke="var(--border)"/><text x="${x(t)}" y="${H - 4}" text-anchor="middle">${t}</text>`; });
  rows.forEach((r, i) => { const y = i * rowH + 6; let cx = left; s += `<text x="${left - 8}" y="${y + 13}" text-anchor="end">${esc(r.p.label)}</text>`;
    [["g", "var(--green)"], ["a", "var(--amber)"], ["r", "var(--muted)"]].forEach(([k, c]) => { const w = x(r[k]) - left; if (w > 0) { s += `<rect x="${cx}" y="${y}" width="${w}" height="18" rx="3" fill="${c}" data-chartp="${esc(r.p.id)}" style="cursor:pointer"><title>${esc(r.p.label)}: ${r[k]}</title></rect>`; cx += w; } });
    s += `<text x="${cx + 6}" y="${y + 13}" style="fill:var(--fg);font-weight:600">${r.g + r.a + r.r}</text>`; });
  return s + "</svg>";
}
function chart14(pid) {
  const days = Array.from({length: 14}, (_, i) => addDaysKey(todayKey(), i - 13));
  const vals = days.map(d => S.vacancies.filter(v => dayKeyOf(v.createdAt) === d && (!pid || v.profileId === pid)));
  const counts = vals.map(v => v.length); const max = Math.max(4, ...counts); const W = 520, H = 190, L = 28, B = 26, T = 10;
  const bw = (W - L - 8) / 14; const y = (n) => T + (H - T - B) * (1 - n / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vacancies identified per day">`;
  [0, Math.round(max / 2), max].forEach(t => { s += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`; });
  days.forEach((d, i) => { const g = vals[i].filter(v => band(v.score) === "green").length; const c = counts[i]; const x0 = L + i * bw + 3; const w = bw - 6;
    if (c) { s += `<rect x="${x0}" y="${y(c)}" width="${w}" height="${y(0) - y(c)}" rx="3" fill="var(--teal)" opacity=".35"><title>${fmtDate(d)}: ${c} identified</title></rect>`; if (g) s += `<rect x="${x0}" y="${y(g)}" width="${w}" height="${y(0) - y(g)}" rx="3" fill="var(--green)"><title>${fmtDate(d)}: ${g} recommended</title></rect>`; }
    if (i % 2 === 1 || i === 13) s += `<text x="${x0 + w / 2}" y="${H - 8}" text-anchor="middle">${d.slice(8)}/${d.slice(5, 7)}</text>`; });
  return s + `</svg><div class="legend" style="margin-top:6px"><span><i style="background:var(--teal);opacity:.35"></i>All identified</span><span><i style="background:var(--green)"></i>Recommended</span></div>`;
}

async function profileClicks(e) {

function blankProfile() { return {id: uid("p"), label: nextLabel(), source: "fictional", status: "Active", roles: [], skills: [], experience: [], certs: [], sectors: [], keywords: [], avoid: [], qual: QUALS[3], hours: [], shifts: [], contracts: [], minHours: "", maxHours: "", minPay: "", area: S.settings.defaultArea || "", radius: S.settings.defaultRadius, travel: [], prefs: [], notes: ""}; }
function tagInput(name, vals = [], ph) { return `<div class="tag-input" data-tags="${name}">${(vals || []).map(v => `<span class="tag">${esc(v)}<button type="button" aria-label="Remove ${esc(v)}">×</button></span>`).join("")}<input type="text" id="t_${name}" placeholder="${esc(ph)}" aria-label="${esc(name)}"></div>`; }
function chipGroup(name, opts, sel = []) { return `<div class="chips" data-chips="${name}" role="group">${opts.map(o => `<button type="button" class="chip" aria-pressed="${(sel || []).includes(o)}">${esc(o)}</button>`).join("")}</div>`; }
function bindTagInputs(root) {
  $$(".tag-input", root).forEach(box => {
    const inp = box.querySelector("input");
    const add = () => { inp.value.split(/[,;]/).map(s => s.trim()).filter(Boolean).forEach(v => { if ([...box.querySelectorAll(".tag")].some(t => t.firstChild.textContent.toLowerCase() === v.toLowerCase())) return; const t = document.createElement("span"); t.className = "tag"; t.append(v); const b = document.createElement("button"); b.type = "button"; b.textContent = "×"; b.setAttribute("aria-label", "Remove " + v); t.append(b); box.insertBefore(t, inp); }); inp.value = ""; };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(); } if (e.key === "Backspace" && !inp.value) { const t = box.querySelectorAll(".tag"); t.length && t[t.length - 1].remove(); } });
    inp.addEventListener("blur", add);
    box.addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") e.target.parentElement.remove(); else inp.focus(); });
  });
}
function bindChips(root) { $$("[data-chips] .chip", root).forEach(c => c.addEventListener("click", () => c.setAttribute("aria-pressed", String(c.getAttribute("aria-pressed") !== "true")))); }
const tags = (name, root = document) => [...root.querySelectorAll(`[data-tags="${name}"] .tag`)].map(t => t.firstChild.textContent).concat(((root.querySelector(`#t_${name}`) || {}).value || "").split(/[,;]/).map(s => s.trim()).filter(Boolean));

/* Skills summary upload */
function startSkillsUpload() {
  openModal("Upload a non-identifying skills summary", `
  ${notice("warn", "Upload a <b>generalised skills summary</b> only (.txt, .md or .docx), never an original CV or confidential document. The file is checked for personal details before anything is read further, and nothing is stored except the profile fields you approve.")}
  <label class="row small" style="margin:10px 0"><input type="checkbox" id="upGov"> I confirm this summary is non-identifying and that using it complies with my employer's confidentiality, information governance and AI usage policies.</label>
  <div class="row"><button class="btn primary" id="upPick" disabled>${icon("upload")}Choose file</button><span class="small muted">or paste text below</span></div>
  <textarea id="upText" style="margin-top:10px" placeholder="Paste a generalised summary, e.g. 'Several years' retail experience including tills and stock rotation. Level 2 English and maths. Looking for part-time daytime work, prefers a quiet environment.'"></textarea>
  <div id="upMsg" style="margin-top:10px"></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="upGo" disabled>${icon("sparkle")}Create profile draft</button></div>`, (m) => {
    const gov = $("#upGov", m); gov.addEventListener("change", () => { $("#upPick", m).disabled = $("#upGo", m).disabled = !gov.checked; });
    $("#upPick", m).addEventListener("click", () => $("#skillsFile").click());

$("#skillsFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let text = "";
  try {
    if (/\.docx$/i.test(f.name)) { const zip = await JSZip.loadAsync(f); const xml = await zip.file("word/document.xml").async("string"); text = xml.replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">"); }
    else text = await f.text();
  } catch { $("#upMsg").innerHTML = notice("err", "That file couldn't be read. Use a .txt, .md or .docx file, or paste the text."); return; }
  $("#upText").value = text.slice(0, 8000); processSkillsText(text);
});
async function processSkillsText(text) {
  const msg = $("#upMsg"); text = (text || "").trim();
  if (!text) { msg.innerHTML = notice("err", "Add some text or choose a file first."); return; }
  const scan = privacyScan(text);
  if (scan.length) { msg.innerHTML = notice("err", `<b>Stopped: this summary seems to contain ${esc(scan.join("; "))}.</b> Remove those details and try again. Nothing has been saved or sent anywhere.`); return; }
  let draft = null;
  if (aiAvailable()) {
    msg.innerHTML = `<span class="small muted"><span class="spinner"></span> Claude is drafting profile fields…</span>`;
    try {

function keywordDraft(t) {

function basicExtract(t) {
  const lines = t.split(/\n/).map(s => s.trim()).filter(Boolean); const l = t.toLowerCase();
  const pay = t.match(/£\s?[\d,]+(\.\d{2})?(\s?(-|to)\s?£?\s?[\d,]+(\.\d{2})?)?\s*(per hour|an hour|p\/h|ph|per annum|a year|pa)?/i);
  let hourly = null; if (pay) { const n = parseFloat(pay[0].replace(/[£,\s]/g, "").split(/-|to/)[0]); hourly = n > 200 ? +(n / 52 / 37.5).toFixed(2) : n; }
  const cd = t.match(/clos\w*\s*(date)?:?\s*(\d{1,2})[\/.\- ](\d{1,2}|[a-z]{3,9})[\/.\- ](\d{2,4})/i); let closing = null;
  if (cd) { const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]; let m = isNaN(cd[3]) ? months.indexOf(cd[3].slice(0, 3).toLowerCase()) + 1 : +cd[3]; let y = +cd[4]; if (y < 100) y += 2000; if (m > 0) closing = `${y}-${String(m).padStart(2, "0")}-${String(+cd[2]).padStart(2, "0")}`; }
  const hpw = t.match(/(\d{1,2}(\.\d)?)\s*(hours|hrs)\s*(per|a|each)?\s*week/i);
  return {title: lines[0] || "", payText: pay ? pay[0] : "", payHourly: hourly, hoursType: /part[- ]time/.test(l) ? "Part-time" : /full[- ]time/.test(l) ? "Full-time" : "Unknown", hoursPerWeek: hpw ? +hpw[1] : null, contract: /permanent/.test(l) ? "Permanent" : /temporary|temp\b/.test(l) ? "Temporary" : /fixed[- ]term/.test(l) ? "Fixed-term" : /apprentice/.test(l) ? "Apprenticeship" : /zero[- ]hours/.test(l) ? "Zero-hours" : "Unknown", closingDate: closing, remote: /remote|work from home|home[- ]based/.test(l), shifts: [/evening/.test(l) && "Evenings", /weekend/.test(l) && "Weekends", /night/.test(l) && "Nights", /early/.test(l) && "Early mornings"].filter(Boolean)};
}

  const v = S.vacancies.find(x => x.id === vid); const p = v && profileById(v.profileId);
  const tasks = isApp ? [["statement", "Supporting statement outline"], ["cover", "Cover letter template"], ["skills", "Skills-to-requirements map"], ["checklist", "Application checklist"]] : [["questions", "Likely interview questions with STAR prompts"], ["adjust", "Reasonable adjustments to consider asking about"], ["practical", "Practical preparation checklist"], ["employer", "Questions to ask the employer"]];
  const saved = v && (isApp ? v.appSupport : v.interviewPrep) || {};

  ${!S.vacancies.length ? `<div class="list-empty">Add a vacancy first. <a href="#live-search">Go to Live Job Search</a>.</div>` : `
  <div class="card"><div class="form-grid"><label class="f span-all">Vacancy${vacancyPicker(vid)}</label></div>
  ${v ? `<div class="row" style="margin-top:10px">${scorePill(v)}<span class="small muted">${esc(p?.label || "")} · ${esc((p?.roles || []).join(", "))} · ${esc(closingText(v))}</span></div>` : ""}</div>
  ${v ? `<div class="grid g2">${tasks.map(([k, label]) => `<div class="card"><div class="card-head"><h2>${esc(label)}</h2><div class="row">${aiAvailable() ? `<button class="btn ai sm" data-gen="${k}">${icon("sparkle")}${saved[k] ? "Regenerate" : "Generate"}</button>` : `<button class="btn sm" data-gen="${k}">Use template</button>`}${saved[k] ? `<button class="btn sm" data-copy="${k}">${icon("copy")}Copy</button><button class="btn sm" data-docx="${k}">${icon("word")}Word</button>` : ""}</div></div><div class="ai-out" id="out_${k}">${saved[k] ? md(saved[k]) : `<span class="muted small">Not generated yet.</span>`}</div></div>`).join("")}</div>` : ""}`}`;
  $("#vpick") && $("#vpick").addEventListener("change", e => go(isApp ? "applications" : "interview", {vacancy: e.target.value}));
  if (!v) return;
  const prompts = {
    statement: `Write a supporting statement outline for this vacancy. Use headings and bullets. For each key requirement, give a prompt for an example to include from the profile's experience areas. Use [placeholders] for anything personal. Under 350 words.`,
    cover: `Write a short cover letter template for this vacancy (under 250 words) with [Name], [Address] and other personal details as placeholders. Draw on the profile's generalised skills.`,
    skills: `Map the vacancy's requirements to the profile's skills and experience. Format as bullets: "Requirement → matching skill or gap → how to evidence it". Then list any gaps with one suggestion each.`,
    checklist: `Create a practical application checklist for this vacancy as bullets: documents, references, right to work, closing date ${fmtDate(v.closingDate)}, how to apply, follow-up.`,
    questions: `List 8 likely interview questions for this vacancy. For each, add a one-line STAR prompt linked to the profile's generalised skills and experience. Use headings for question themes.`,
    adjust: `List reasonable adjustments that could be relevant to discuss for the interview and the job, based only on the profile's working preferences (not on any condition). Include how to raise them positively and mention Access to Work where relevant. Bullets.`,
    practical: `Write a practical interview preparation checklist: travel planning by ${(p.travel || []).join("/") || "public transport"}, timing, what to bring, what to research about the employer, how to follow up. Bullets.`,
    employer: `Suggest 6 good questions the candidate could ask the employer at interview for this vacancy, including ones that check fit with the profile's working preferences. Bullets.`

    if (g) {
      const k = g.dataset.gen; const out = $("#out_" + k); g.disabled = true; let txt = "";

        try { txt = await aiText(prompts[k] + `\n\nProfile: ${JSON.stringify(profileForAI(p))}\n\nVacancy: ${JSON.stringify(vacancyForAI(v))}`, t => { out.innerHTML = md(t); }); }
        catch (err) { out.innerHTML = notice("warn", esc(aiErr(err))); g.disabled = false; return; } }

    if (d) { const k = d.dataset.docx; const label = tasks.find(t => t[0] === k)[1]; const txt = (isApp ? v.appSupport : v.interviewPrep)[k];
      await makeDocx(`${label} - ${v.title}`, [{t: "title", x: label}, {t: "p", x: `${v.title} – ${v.employer || ""} · ${p?.label || ""} · Generated ${fmtDate(new Date().toISOString())}`}, ...mdToBlocks(txt)], `${slug(label)}-${slug(v.title)}.docx`, {type: isApp ? "Application support" : "Interview preparation", profileId: p?.id}); }
  });
}
function templateText(k, v, p) {
  const sk = (p.skills || []).join(", ") || "[skills]";
  return {statement: `# Supporting statement outline\n- Opening: why this ${v.title} role at ${v.employer || "[employer]"}\n- Relevant skills: ${sk}\n- Example 1: [situation, task, action, result]\n- Example 2: [situation, task, action, result]\n- Closing: availability and enthusiasm`,
    cover: `Dear Hiring Manager,\n\nI am applying for the ${v.title} role. I bring ${sk}.\n\n[Example of relevant experience]\n\nI would welcome the chance to discuss my application.\n\nYours faithfully,\n[Name]`,
    skills: (v.requirements || []).map(r => `- ${r} → [matching skill or gap]`).join("\n") || "- [Requirement] → [matching skill]",
    checklist: `- Read the full advert and person specification\n- Prepare CV and references\n- Right to work documents\n- Closing date: ${fmtDate(v.closingDate)}\n- Submit and note the date\n- Follow up after one week`,
    questions: `- Tell us about yourself.\n- Why do you want this role?\n- Describe a time you gave good customer service.\n- How do you handle a busy period?\n- Tell us about working in a team.\n- What would you do if you made a mistake?`,
    adjust: (p.prefs || []).map(x => `- ${x}: ask whether this can be accommodated`).join("\n") || "- [Working preference]: ask whether this can be accommodated",
    practical: `- Plan the journey and do a trial run\n- Arrive 10 minutes early\n- Bring ID and any requested documents\n- Research the employer\n- Send a thank-you message afterwards`,
    employer: `- What does a typical day look like?\n- What training is provided?\n- How are shifts arranged?\n- What support is available for new starters?`}[k];
}

  $("#skAi") && $("#skAi").addEventListener("click", async () => { const out = $("#skOut"); out.innerHTML = `<span class="spinner"></span> Thinking…`;
    try { const t = await aiText(`Suggest a short development plan (under 250 words) for this profile to improve their chances for the target roles. Use headings: Quick wins (this month), Short courses or certificates, Experience-building options. Prefer free UK options (National Careers Service, Skills Bootcamps, Free Courses for Jobs, Learn My Way, volunteering, work trials). Known gaps from vacancies: ${JSON.stringify(gaps.slice(0, 8).map(g => g[0]))}.\n\nProfile: ${JSON.stringify(profileForAI(p))}`, t => { out.innerHTML = md(t); }); p.devPlan = t; await persist(p); }

const xe = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");

async function buildDocx(blocks) {

async function makeDocx(title, blocks, filename, meta, existing) {

    openModal(title, `<p class="small">Word downloads aren't available in this view. Copy the report and paste it into Word (tables paste as tab-separated columns).</p><textarea id="rpT" style="min-height:320px">${esc(txt)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="rpC">${icon("copy")}Copy report</button></div>`, m => $("#rpC", m).addEventListener("click", () => copyText($("#rpT", m).value)), true); }
  if (existing) return;
  if (meta) await persist({id: uid("r"), title, type: meta.type, kind: meta.kind || "doc", profileId: meta.profileId || "", days: meta.days || null, filename, blocks: meta.kind ? null : blocks, status: "Ready for review", createdAt: new Date().toISOString(), downloaded: ok});
  if (VIEW === "reports" || VIEW === "home") render();
}
async function saveFile(filename, data, type) {
  const blob = typeof data === "string" ? new Blob([data], {type: type || "text/plain"}) : data;
  if (!CAP.downloads && !window.claude) { // standalone copy: a normal browser download works
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast(`Downloaded ${filename}.`); return true; }
  if (!CAP.downloads) {
    if (typeof data === "string") { openModal("Copy your file", `<p class="small">File downloads aren't available in this view, so copy the text below and paste it into a new file named <b>${esc(filename)}</b>.</p><textarea id="cpF" style="min-height:260px">${esc(data)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="cpFb">${icon("copy")}Copy</button></div>`, m => $("#cpFb", m).addEventListener("click", () => copyText($("#cpF", m).value))); return true; }
    return false; }
  try { await CAP.downloads.save({filename, data: blob}); toast(`Saved ${filename}.`); return true; }
  catch (e) { toast(e && e.code === "declined" ? "Download cancelled." : e && e.code === "rate_limited" ? "A download is already waiting for your confirmation." : "The file couldn't be saved here."); return false; }
}

async function importBackup(text) { let d;
  try { d = JSON.parse(text); } catch { toast("That isn't a valid backup."); return; }
  if (!d || d.app !== "AI Employment Intelligence Hub") { toast("That file isn't a hub backup."); return; }
  const profText = (d.profiles || []).map(p => [p.roles, p.skills, p.experience, p.notes, p.area].flat().join(" ")).join(" ");
  const scan = privacyScan(profText); if (scan.length) { toast("Import stopped: the profiles contain " + scan[0] + "."); return; }
  let n = 0;
  for (const k of Object.values(KINDS)) for (const x of (d[k] || [])) { if (!x || typeof x.id !== "string" || kindOf(x.id) !== k) continue; await persist(x); n++; }
  if (d.settings && typeof d.settings === "object") { S.settings = {...DEFAULT_SETTINGS, ...d.settings}; await saveSettings(); }
  toast(`Imported ${n} items.`); render();
}
